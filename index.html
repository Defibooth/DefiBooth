<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#111111">
<title>ASSP Saint-Privat-des-Vieux</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@500;600&family=Fredoka:wght@600&display=swap" rel="stylesheet">
<style>
  :root {
    --orange: #ffd200;      /* jaune du club (couleur d'accent) */
    --rouge: #e30613;
    --violet: #1a1a1a;
    --violet-light: #e30613;
    --vert: #ffd200;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: #0d0d0d; color: #fff; font-family: "Oswald", "Arial Narrow", sans-serif; overflow: hidden; }

  #stage { position: fixed; inset: 0; }
  #video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #video.mirror { transform: scaleX(-1); }
  #overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  #controls {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    padding: 18px 26px calc(22px + env(safe-area-inset-bottom));
    display: flex; align-items: center; justify-content: space-between;
  }
  .round {
    width: 54px; height: 54px; border-radius: 50%; cursor: pointer;
    border: 2px solid var(--orange); background: rgba(20,20,20,.75); color: #fff; font-size: 22px;
    display: flex; align-items: center; justify-content: center;
  }
  .ctl { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .ctl span { font-size: 13px; color: #fff; text-shadow: 0 1px 4px #000; font-weight: 600; }
  .round.on { background: var(--orange); }
  #shutter {
    width: 82px; height: 82px; border-radius: 50%; cursor: pointer;
    border: 4px solid var(--orange); background: radial-gradient(circle at 50% 40%, #fff, #e8e8e8);
    box-shadow: 0 0 0 4px var(--rouge), 0 4px 18px rgba(0,0,0,.5);
    font-size: 36px; display: flex; align-items: center; justify-content: center;
    transition: transform .1s;
  }
  #shutter:active { transform: scale(.9); }

  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 8; }
  #countdown {
    position: fixed; inset: 0; z-index: 7; pointer-events: none; display: none;
    align-items: center; justify-content: center;
    font-family: "Anton", Impact, sans-serif; font-size: 170px; color: var(--orange);
    text-shadow: 0 0 25px #000, 6px 6px 0 var(--rouge);
  }

  /* Écran résultat : la photo reste en plein écran, les boutons par-dessus en bas */
  #result { position: fixed; inset: 0; z-index: 10; display: none; background: #000; }
  #result #photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #result .panel {
    position: absolute; left: 0; right: 0; bottom: 0;
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    padding: 70px 16px calc(22px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, rgba(10,10,10,.97) 0%, rgba(10,10,10,.9) 60%, rgba(10,10,10,0) 100%);
  }
  #result .hint { font-size: clamp(17px, 4.6vw, 21px); text-align: center; max-width: 420px; line-height: 1.35; margin: 0; }
  #result .status { font-size: clamp(18px, 5vw, 22px); font-weight: 600; color: var(--vert); text-align: center; margin: 0; text-shadow: 0 1px 4px #000; }
  #result .status.err { color: #ff9a9a; }
  #result .btn { width: 100%; max-width: 440px; font-size: clamp(20px, 5.6vw, 26px); padding: 20px 18px; }
  #result .btn.big { font-size: clamp(23px, 6.6vw, 30px); padding: 24px 18px; }
  #result .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; max-width: 440px; }
  #result .row .btn { width: 100%; white-space: nowrap; font-size: clamp(18px, 5vw, 24px); padding: 18px 10px; }
  #result .row.single { grid-template-columns: 1fr; }
  [hidden] { display: none !important; }
  #result .credit { display: flex; align-items: center; justify-content: center; gap: 10px; color: #f4ece0; font-size: 16px; text-decoration: none; }
  #result .credit .brand { display: flex; align-items: flex-end; }
  #result .credit img { height: 30px; width: auto; display: block; }
  #result .credit .tld { font-family: "Fredoka", "Arial Rounded MT Bold", sans-serif; font-weight: 600; color: #fff; font-size: 22px; line-height: 1; margin-left: 2px; padding-bottom: 3px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .btn {
    border: none; border-radius: 40px; padding: 18px 30px; cursor: pointer;
    font-family: "Oswald", "Arial Narrow", sans-serif; font-size: 20px; font-weight: 600; letter-spacing: .5px;
    background: var(--orange); color: #111; box-shadow: 0 4px 0 #b39300, 0 6px 18px rgba(0,0,0,.45);
  }
  .btn.secondary { background: rgba(20,20,20,.85); color: #fff; border: 3px solid var(--violet-light); box-shadow: none; }

  /* Écran d'accueil */
  #start {
    position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 22px; padding: 30px; text-align: center;
    background: linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,.8)), linear-gradient(115deg, #ffd200 0 47%, #111 47% 49%, #e30613 49% 100%);
  }
  #start .crest { width: 150px; height: auto; margin-top: 10px; filter: drop-shadow(0 6px 14px rgba(0,0,0,.6)); }
  #start h1 { font-family: "Anton", Impact, sans-serif; font-weight: normal; font-size: 46px; line-height: 1.05; color: var(--orange); text-transform: uppercase; text-shadow: 3px 3px 0 var(--rouge), 0 4px 14px rgba(0,0,0,.6); }
  #start .date { font-size: 18px; color: #fff; letter-spacing: 2px; text-transform: uppercase; }
  #start .lieu { font-size: 14px; color: var(--orange); letter-spacing: 1px; margin-top: -14px; }
  #start p { font-size: 15px; max-width: 300px; line-height: 1.5; opacity: .9; }
  #start .info { font-size: 12px; opacity: .7; margin-top: -8px; }
  #start .err { color: #ff8a8a; font-size: 13px; }
  #start.hidden { display: none; }
  /* Mise en page proportionnelle à l'écran du téléphone (fonctionne aussi si le
     téléphone affiche la « version pour ordinateur ») */
  @media (orientation: portrait) {
    #controls { padding: 4.5vw 6.5vw calc(5.6vw + env(safe-area-inset-bottom)); }
    .ctl { gap: 1.4vw; }
    .ctl span { font-size: 3.4vw; }
    .round { width: 15vw; height: 15vw; font-size: 5.8vw; border-width: .6vw; }
    #shutter { width: 21vw; height: 21vw; font-size: 9.4vw; border-width: 1vw; }
    #countdown { font-size: 44vw; }
    #start { gap: 5.6vw; padding: 7.7vw; }
    #start .crest { width: 38vw; margin-top: 2vw; }
    #start h1 { font-size: 10.5vw; white-space: nowrap; }
    #start .date { font-size: 4.3vw; }
    #start .lieu { font-size: 3.8vw; margin-top: -3.6vw; }
    #start p { font-size: 4vw; max-width: 80vw; }
    #start .info { font-size: 3.2vw; }
    #start .err { font-size: 3.4vw; }
    #start .btn { font-size: 5.2vw; padding: 4.6vw 7.5vw; border-radius: 10vw; }
    #result .panel { gap: 3.4vw; padding: 18vw 4vw calc(5.6vw + env(safe-area-inset-bottom)); }
    #result .hint { font-size: 4.6vw; max-width: none; }
    #result .status { font-size: 5.2vw; }
    #result .btn { max-width: none; font-size: 5.8vw; padding: 5vw 4vw; border-radius: 10vw; border-width: .8vw; }
    #result .btn.big { font-size: 7vw; padding: 6vw 4vw; }
    #result .row { max-width: none; gap: 3vw; }
    #result .row .btn { font-size: 5.2vw; padding: 4.6vw 2.5vw; }
    #result .credit { font-size: 4vw; gap: 2.6vw; }
    #result .credit img { height: 8vw; }
    #result .credit .tld { font-size: 5.8vw; padding-bottom: .8vw; }
  }
  /* Téléphone tourné en paysage : boutons sur le côté droit */
  @media (orientation: landscape) {
    #controls { top: 0; bottom: 0; left: auto; right: 0; flex-direction: column; justify-content: space-evenly;
      padding: 3vh calc(4vh + env(safe-area-inset-right)) 3vh 3vh; }
    .ctl { gap: 1.2vh; }
    .ctl span { font-size: 3.4vh; }
    .round { width: 14vh; height: 14vh; font-size: 5.8vh; border-width: .6vh; }
    #shutter { width: 21vh; height: 21vh; font-size: 9.4vh; border-width: 1vh; }
    #countdown { font-size: 44vh; }
    #start { gap: 3vh; padding: 5vh 8vw; overflow-y: auto; }
    #start .crest { width: auto; height: 26vh; margin-top: 0; }
    #start h1 { font-size: 9vh; white-space: nowrap; }
    #start .date { font-size: 4vh; }
    #start .lieu { font-size: 3.6vh; margin-top: -2vh; }
    #start p { font-size: 3.6vh; max-width: 70vw; }
    #start .info { font-size: 3vh; }
    #start .btn { font-size: 5vh; padding: 3.4vh 6vh; border-radius: 10vh; }
    #result .panel { left: auto; top: 0; bottom: 0; right: 0; width: 46vw; justify-content: center; gap: 2.6vh;
      padding: 4vh calc(4vh + env(safe-area-inset-right)) 4vh 9vw;
      background: linear-gradient(to left, rgba(10,10,10,.97) 0%, rgba(10,10,10,.9) 65%, rgba(10,10,10,0) 100%); }
    #result .hint { font-size: 3.6vh; max-width: none; }
    #result .status { font-size: 4.2vh; }
    #result .btn { max-width: none; font-size: 5vh; padding: 3.2vh 3vh; border-radius: 10vh; border-width: .7vh; }
    #result .btn.big { font-size: 6vh; padding: 4vh 3vh; }
    #result .row { max-width: none; gap: 2vh; }
    #result .row .btn { font-size: 4.4vh; padding: 3vh 1.5vh; }
    #result .credit { font-size: 3.4vh; gap: 1.6vh; }
    #result .credit img { height: 6.5vh; }
    #result .credit .tld { font-size: 4.8vh; padding-bottom: .6vh; }
  }
</style>
</head>

   CONFIGURATION — les seules lignes à modifier
   ========================================================= */
const CONFIG = {
  titre: "Allez l'ASSP !",
  date: "Saison 2026 / 2027",
  lieu: "Saint-Privat-des-Vieux",
  nomFichier: "assp-saint-privat",

  // Nom du dossier Google Drive où arrivent les photos de cet événement
  dossierDrive: "Photos ASSP Saint-Privat-des-Vieux",
  // Adresse du script Google qui range les photos dans ton Google Drive (voir le guide).
  // Laisse "" pour désactiver l'envoi.
  urlEnvoi: "https://script.google.com/macros/s/AKfycbyDxFbVk5VjKqHWECnpjt9UBWVyByYAZvGKmPpk_ca00UqHjBgMtJnxQuYlUmT2Xwe8/exec",
  cameraParDefaut: "user"   // "user" = selfie, "environment" = caméra arrière
};
/* ========================================================= */

document.getElementById('startTitle').textContent = CONFIG.titre;
document.getElementById('startDate').textContent = CONFIG.date;
document.getElementById('startLieu').textContent = CONFIG.lieu;
if (CONFIG.urlEnvoi) document.getElementById('startInfo').hidden = false;

const video = document.getElementById('video');
const overlay = document.getElementById('overlay');
const startEl = document.getElementById('start');
const startErr = document.getElementById('startErr');
let facing = CONFIG.cameraParDefaut;
let stream = null;
let timerOn = false;

/* ---------- Caméra ---------- */
let mirrored = false;
let switching = false;

async function openStream(mode, exact) {
  return navigator.mediaDevices.getUserMedia({
    video: { facingMode: exact ? { exact: mode } : { ideal: mode }, width: { ideal: 1920 }, height: { ideal: 1080 } },
    audio: false
  });
}

// Cherche la caméra demandée (avant / arrière) parmi celles du téléphone
async function openByLabel(mode) {
  const devices = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
  const back = /back|rear|arri[eè]re|environment|world/i, front = /front|avant|user|face/i;
  const wanted = devices.find(d => (mode === 'environment' ? back : front).test(d.label));
  if (!wanted) return null;
  return navigator.mediaDevices.getUserMedia({ video: { deviceId: { exact: wanted.deviceId }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
}

async function startCamera() {
  startErr.textContent = "";
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showStart("Ton navigateur ne permet pas l'accès à la caméra. Ouvre la page dans Safari ou Chrome.");
    return;
  }
  try {
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    let s = null;
    try { s = await openStream(facing, true); }
    catch (e) {
      if (e.name === 'NotAllowedError') throw e;
      try { s = await openByLabel(facing); } catch (e2) { s = null; }
      if (!s) s = await openStream(facing, false);
    }
    stream = s;
    const settings = stream.getVideoTracks()[0].getSettings ? stream.getVideoTracks()[0].getSettings() : {};
    const real = settings.facingMode || facing;
    mirrored = real === 'user';
    video.srcObject = stream;
    video.classList.toggle('mirror', mirrored);
    await video.play();
    startEl.classList.add('hidden');
    drawOverlay();
  } catch (e) {
    let msg = "Impossible d'ouvrir la caméra.";
    if (e.name === 'NotAllowedError') msg = "Accès refusé. Autorise la caméra dans les réglages du navigateur, puis réessaie.";
    if (e.name === 'NotFoundError') msg = "Aucune caméra trouvée sur cet appareil.";
    showStart(msg);
  }
}

async function switchCamera() {
  if (switching) return;
  switching = true;
  const btn = document.getElementById('switchBtn');
  btn.classList.add('on');
  const before = facing;
  facing = facing === 'user' ? 'environment' : 'user';
  await startCamera();
  if (!stream) { facing = before; await startCamera(); }   // retour à la caméra d'avant si échec
  btn.classList.remove('on');
  switching = false;
}
function showStart(err) { startEl.classList.remove('hidden'); startErr.textContent = err || ""; }

const crest = new Image();
crest.onload = () => drawOverlay();
crest.src = CREST_SRC;
const JAUNE = '#ffd200', ROUGE = '#e30613', NOIR = '#111111';

function emoji(ctx, char, x, y, size, rot = 0) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot);
  ctx.font = `${size}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(char, 0, 0);
  ctx.restore();
}

function paintFrame(ctx, w, h) {
  const u = Math.min(w, h) / 100;
  const land = w > h * 1.1;   // téléphone tourné en paysage

  // Assombrit le haut pour la lisibilité du titre
  let g = ctx.createLinearGradient(0, 0, 0, h * 0.34);
  g.addColorStop(0, 'rgba(0,0,0,.55)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h * 0.34);

  // Bandeau du haut : jaune à gauche, rouge à droite, en diagonale (comme le maillot)
  const bh = land ? 15 * u : 19 * u;
  ctx.save();
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(w * 0.56, 0); ctx.lineTo(w * 0.44, bh); ctx.lineTo(0, bh * 1.25); ctx.closePath();
  ctx.fillStyle = JAUNE; ctx.globalAlpha = .93; ctx.fill();
  ctx.beginPath(); ctx.moveTo(w * 0.58, 0); ctx.lineTo(w, 0); ctx.lineTo(w, bh * 1.25); ctx.lineTo(w * 0.46, bh); ctx.closePath();
  ctx.fillStyle = ROUGE; ctx.fill();
  ctx.globalAlpha = 1;
  // filet noir entre les deux couleurs
  ctx.beginPath(); ctx.moveTo(w * 0.57, 0); ctx.lineTo(w * 0.45, bh); ctx.strokeStyle = NOIR; ctx.lineWidth = 1.4 * u; ctx.stroke();
  // ombre sous le bandeau
  ctx.beginPath(); ctx.moveTo(0, bh * 1.25); ctx.lineTo(w * 0.45, bh); ctx.lineTo(w, bh * 1.25);
  ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 1 * u; ctx.stroke();
  ctx.restore();

  // Cadre : moitié gauche jaune, moitié droite rouge
  const m = 2.6 * u, lw = 1.6 * u;
  ctx.save(); ctx.lineWidth = lw; ctx.lineJoin = 'round';
  ctx.strokeStyle = JAUNE;
  ctx.beginPath(); ctx.moveTo(w / 2, m); ctx.lineTo(m, m); ctx.lineTo(m, h - m); ctx.lineTo(w / 2, h - m); ctx.stroke();
  ctx.strokeStyle = ROUGE;
  ctx.beginPath(); ctx.moveTo(w / 2, m); ctx.lineTo(w - m, m); ctx.lineTo(w - m, h - m); ctx.lineTo(w / 2, h - m); ctx.stroke();
  ctx.restore();

  // Blason : au centre (portrait) ou dans le coin gauche (paysage)
  const ch = land ? 30 * u : 33 * u;
  let cw = ch * 0.834;
  if (crest.complete && crest.naturalWidth) cw = ch * crest.naturalWidth / crest.naturalHeight;
  const cx = land ? 6 * u : w / 2 - cw / 2;
  const cy = land ? 3 * u : 2.5 * u;
  if (crest.complete && crest.naturalWidth) {
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,.55)'; ctx.shadowBlur = 3 * u; ctx.shadowOffsetY = 1 * u;
    ctx.drawImage(crest, cx, cy, cw, ch);
    ctx.restore();
  }

  // Titre
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  const titre = CONFIG.titre.toUpperCase();
  let size = land ? 11 * u : 12 * u;
  const maxW = land ? w * 0.5 : w * 0.88;
  ctx.font = `${size}px "Anton", Impact, sans-serif`;
  while (ctx.measureText(titre).width > maxW && size > 4 * u) { size -= 0.5 * u; ctx.font = `${size}px "Anton", Impact, sans-serif`; }
  const tx = w / 2;
  const titleY = land ? bh + 3 * u + size : cy + ch + 3 * u + size;
  ctx.lineJoin = 'round';
  ctx.fillStyle = ROUGE; ctx.fillText(titre, tx + 0.8 * u, titleY + 0.8 * u);
  ctx.lineWidth = 1.2 * u; ctx.strokeStyle = NOIR; ctx.strokeText(titre, tx, titleY);
  ctx.fillStyle = JAUNE; ctx.fillText(titre, tx, titleY);

  // Date et lieu (sur une seule ligne en paysage)
  ctx.shadowColor = 'rgba(0,0,0,.85)'; ctx.shadowBlur = 1.5 * u;
  if (land) {
    ctx.font = `600 ${4.6 * u}px "Oswald", "Arial Narrow", sans-serif`;
    ctx.fillStyle = '#ffffff';
    ctx.fillText(CONFIG.date.toUpperCase() + '  •  ' + CONFIG.lieu, tx, titleY + 7 * u);
  } else {
    ctx.font = `600 ${4.8 * u}px "Oswald", "Arial Narrow", sans-serif`;
    ctx.fillStyle = '#ffffff';
    ctx.fillText(CONFIG.date.toUpperCase(), tx, titleY + 6.5 * u);
    ctx.font = `500 ${3.9 * u}px "Oswald", "Arial Narrow", sans-serif`;
    ctx.fillStyle = JAUNE;
    ctx.fillText(CONFIG.lieu, tx, titleY + 11.5 * u);
  }
  ctx.restore();

  // Ballons
  emoji(ctx, '⚽', 11 * u, h - 10 * u, 10 * u, -0.2);
  emoji(ctx, '🏆', w - 11 * u, h - 10 * u, 10 * u, 0.1);
}

function drawOverlay() {
  const dpr = window.devicePixelRatio || 1;
  overlay.width = overlay.clientWidth * dpr;
  overlay.height = overlay.clientHeight * dpr;
  const ctx = overlay.getContext('2d');
  ctx.clearRect(0, 0, overlay.width, overlay.height);
  paintFrame(ctx, overlay.width, overlay.height);
}
window.addEventListener('resize', drawOverlay);
// Redessine une fois les polices chargées
if (document.fonts) {
  Promise.all([document.fonts.load('40px "Anton"'), document.fonts.load('600 20px "Oswald"'), document.fonts.load('500 20px "Oswald"')])
    .then(drawOverlay).catch(() => {});
}

/* ---------- Prise de photo ---------- */
let lastBlob = null;
let counting = false;

function capture() {
  const sw = window.innerWidth, sh = window.innerHeight;
  const scale = Math.min(2, Math.max(1080 / Math.min(sw, sh), 1));
  const W = Math.round(sw * scale), H = Math.round(sh * scale);
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const ctx = c.getContext('2d');

  const vw = video.videoWidth, vh = video.videoHeight;
  const r = Math.max(W / vw, H / vh);
  const dw = vw * r, dh = vh * r;
  ctx.save();
  if (mirrored) { ctx.translate(W, 0); ctx.scale(-1, 1); }
  ctx.drawImage(video, (W - dw) / 2, (H - dh) / 2, dw, dh);
  ctx.restore();
  paintFrame(ctx, W, H);

  const f = document.getElementById('flash');
  f.style.transition = 'none'; f.style.opacity = 1;
  requestAnimationFrame(() => { f.style.transition = 'opacity .4s'; f.style.opacity = 0; });

  c.toBlob(blob => {
    lastBlob = blob;
    document.getElementById('photo').src = URL.createObjectURL(blob);
    document.getElementById('result').style.display = 'flex';
    const canShare = canShareFile();
    document.getElementById('shareBtn').hidden = !canShare;
    document.querySelector('#result .row').classList.toggle('single', !canShare);
    document.getElementById('saveHint').textContent = isIOS
      ? "Appuie puis choisis « Enregistrer l'image » pour la garder dans tes Photos."
      : "Ta photo sera enregistrée dans ta Galerie.";
    sendPhoto(blob);
  }, 'image/jpeg', 0.9);
}

async function shoot() {
  if (counting || !stream) return;
  if (timerOn) {
    counting = true;
    const cd = document.getElementById('countdown');
    cd.style.display = 'flex';
    for (let i = 3; i > 0; i--) { cd.textContent = i; await new Promise(r => setTimeout(r, 1000)); }
    cd.style.display = 'none';
    counting = false;
  }
  capture();
}

/* ---------- Envoi automatique vers le Google Drive de l'organisateur ---------- */
async function sendPhoto(blob, tries = 3) {
  if (!CONFIG.urlEnvoi) return;
  const st = document.getElementById('sendStatus');
  st.hidden = false; st.classList.remove('err');
  st.textContent = "🧹 Envoi de la photo aux organisateurs…";
  const base64 = await new Promise(res => {
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(',')[1]);
    r.readAsDataURL(blob);
  });
  const body = JSON.stringify({ name: `${CONFIG.nomFichier}-${Date.now()}.jpg`, image: base64, dossier: CONFIG.dossierDrive });
  for (let i = 0; i < tries; i++) {
    try {
      // "text/plain" évite le blocage du navigateur ; le script Google lit le JSON quand même
      await fetch(CONFIG.urlEnvoi, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body });
      st.textContent = "✓ Photo envoyée aux organisateurs";
      return;
    } catch (e) {
      await new Promise(r => setTimeout(r, 1500));
    }
  }
  st.classList.add('err');
  st.textContent = "La photo n'a pas pu être envoyée (pas de réseau ?). Enregistre-la dans ta galerie.";
}

/* ---------- Enregistrer / partager ---------- */
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function photoFile() {
  return new File([lastBlob], `${CONFIG.nomFichier}-${Date.now()}.jpg`, { type: 'image/jpeg' });
}
function canShareFile() {
  try { return !!(navigator.canShare && navigator.canShare({ files: [photoFile()] })); } catch (e) { return false; }
}
function download() {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(lastBlob);
  a.download = photoFile().name;
  document.body.appendChild(a); a.click(); a.remove();
}
async function share() {
  try { await navigator.share({ files: [photoFile()] }); return true; }
  catch (e) { return e.name === 'AbortError'; }
}
async function save() {
  if (!lastBlob) return;
  const hint = document.getElementById('saveHint');
  if (isIOS && canShareFile()) {
    // iPhone : le menu de partage propose « Enregistrer l'image » (va dans Photos)
    hint.textContent = "Choisis « Enregistrer l'image » dans le menu.";
    if (await share()) return;
  }
  // Android et autres : enregistrement direct (dossier Téléchargements, visible dans la Galerie)
  download();
  hint.textContent = "✓ Photo enregistrée ! Retrouve-la dans ta Galerie (dossier Téléchargements). Si rien ne se passe, reste appuyé sur la photo puis « Télécharger l'image ».";
}

/* ---------- Boutons ---------- */
document.getElementById('startBtn').onclick = startCamera;
document.getElementById('shutter').onclick = shoot;
document.getElementById('switchBtn').onclick = switchCamera;
document.getElementById('retakeBtn').onclick = () => { document.getElementById('result').style.display = 'none'; };
document.getElementById('saveBtn').onclick = save;
document.getElementById('shareBtn').onclick = () => { if (lastBlob) share(); };

// L'appareil photo s'ouvre seulement quand on appuie sur le bouton de l'écran d'accueil.
</script>
