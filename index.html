<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1a0b24">
<title>Marché des Sorcières</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Cinzel:wght@600&display=swap" rel="stylesheet">
<style>
  :root {
    --orange: #ff7a1a;
    --orange-glow: #ffb15c;
    --violet: #2b0f3a;
    --violet-light: #6b2fa0;
    --vert: #7dff6a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: #0b0510; color: #fff; font-family: "Cinzel", Georgia, serif; overflow: hidden; }

  #stage { position: fixed; inset: 0; }
  #video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #video.mirror { transform: scaleX(-1); }
  #overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  #controls {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    padding: 18px 26px calc(22px + env(safe-area-inset-bottom));
    display: flex; align-items: center; justify-content: space-between;
  }
  .round {
    width: 54px; height: 54px; border-radius: 50%; cursor: pointer;
    border: 2px solid var(--orange); background: rgba(43,15,58,.75); color: #fff; font-size: 22px;
    display: flex; align-items: center; justify-content: center;
  }
  .round.on { background: var(--orange); }
  #shutter {
    width: 82px; height: 82px; border-radius: 50%; cursor: pointer;
    border: 4px solid var(--orange); background: radial-gradient(circle at 50% 40%, #3a1450, #12051a);
    box-shadow: 0 0 18px var(--orange), inset 0 0 12px rgba(255,122,26,.6);
    font-size: 36px; display: flex; align-items: center; justify-content: center;
    transition: transform .1s;
  }
  #shutter:active { transform: scale(.9); }

  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 8; }
  #countdown {
    position: fixed; inset: 0; z-index: 7; pointer-events: none; display: none;
    align-items: center; justify-content: center;
    font-family: "Creepster", cursive; font-size: 170px; color: var(--orange);
    text-shadow: 0 0 25px #000, 0 0 40px var(--orange);
  }

  /* Écran résultat */
  #result {
    position: fixed; inset: 0; z-index: 10; display: none;
    flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    padding: 20px 16px calc(20px + env(safe-area-inset-bottom));
    background: radial-gradient(ellipse at top, #3a1450, #0b0510 70%);
  }
  #result img { max-width: 100%; max-height: 62vh; border-radius: 8px; border: 3px solid var(--orange); box-shadow: 0 0 30px rgba(255,122,26,.45); }
  #result .hint { font-size: 16px; opacity: .85; text-align: center; max-width: 340px; line-height: 1.4; }
  #result .status { font-size: 17px; color: var(--vert); text-align: center; }
  #result .status.err { color: #ff8a8a; }
  #result .btn.big { width: 100%; max-width: 340px; font-size: 23px; padding: 20px 30px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .btn {
    border: none; border-radius: 40px; padding: 18px 30px; cursor: pointer;
    font-family: "Cinzel", serif; font-size: 20px; font-weight: 600; letter-spacing: .5px;
    background: var(--orange); color: #1a0b24; box-shadow: 0 0 14px rgba(255,122,26,.6);
  }
  .btn.secondary { background: transparent; color: #fff; border: 2px solid var(--violet-light); box-shadow: none; }

  /* Écran d'accueil */
  #start {
    position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 22px; padding: 30px; text-align: center;
    background: radial-gradient(circle at 50% 18%, #ffe9a8 0 48px, rgba(255,233,168,.15) 50px, transparent 120px),
                radial-gradient(ellipse at bottom, #4b1a66, #12051a 70%);
  }
  #start .icons { font-size: 42px; letter-spacing: 8px; margin-top: 70px; }
  #start h1 { font-family: "Creepster", cursive; font-weight: normal; font-size: 46px; line-height: 1.05; color: var(--orange); text-shadow: 0 0 18px rgba(255,122,26,.7); }
  #start .date { font-size: 16px; color: var(--vert); letter-spacing: 2px; }
  #start .lieu { font-size: 14px; color: #ffe9a8; letter-spacing: 1px; margin-top: -14px; }
  #start p { font-size: 15px; max-width: 300px; line-height: 1.5; opacity: .9; }
  #start .info { font-size: 12px; opacity: .7; margin-top: -8px; }
  #start .err { color: #ff8a8a; font-size: 13px; }
  #start.hidden { display: none; }
</style>
</head>
<body>

<div id="start">
  <div class="icons">🦇🌙🦇</div>
  <h1 id="startTitle">Marché des Sorcières</h1>
  <div class="date" id="startDate"></div>
  <div class="lieu" id="startLieu"></div>
  <p>Autorise l'appareil photo et viens prendre ta photo ensorcelée…</p>
  <p class="info" id="startInfo" hidden>Tes photos sont aussi envoyées aux organisateurs pour l'album de l'événement.</p>
  <button class="btn" id="startBtn">🧙 Ouvrir l'appareil photo</button>
  <p class="err" id="startErr"></p>
</div>

<div id="stage">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>
</div>

<div id="countdown"></div>
<div id="flash"></div>

<div id="controls">
  <button class="round" id="timerBtn" title="Retardateur">⏱️</button>
  <button id="shutter" aria-label="Prendre la photo">🎃</button>
  <button class="round" id="switchBtn" title="Changer de caméra">🔄</button>
</div>

<div id="result">
  <img id="photo" alt="Ta photo">
  <p class="status" id="sendStatus" hidden></p>
  <button class="btn big" id="saveBtn">📥 Enregistrer la photo</button>
  <p class="hint" id="saveHint">Ta photo sera enregistrée sur ton téléphone.</p>
  <div class="row">
    <button class="btn secondary" id="retakeBtn">↺ Reprendre</button>
    <button class="btn secondary" id="shareBtn" hidden>📤 Partager</button>
  </div>
</div>

<script>
/* =========================================================
   CONFIGURATION — les seules lignes à modifier
   ========================================================= */
const CONFIG = {
  titre: "Marché des Sorcières",
  date: "1er novembre 2026",
  lieu: "Saint-Chaptes",
  nomFichier: "marche-des-sorcieres",
  // Adresse du script Google qui range les photos dans ton Google Drive (voir le guide).
  // Laisse "" pour désactiver l'envoi.
  urlEnvoi: "https://script.google.com/macros/s/AKfycbyDxFbVk5VjKqHWECnpjt9UBWVyByYAZvGKmPpk_ca00UqHjBgMtJnxQuYlUmT2Xwe8/exec",
  cameraParDefaut: "user"   // "user" = selfie, "environment" = caméra arrière
};
/* ========================================================= */

document.getElementById('startTitle').textContent = CONFIG.titre;
document.getElementById('startDate').textContent = CONFIG.date;
document.getElementById('startLieu').textContent = CONFIG.lieu;
if (CONFIG.urlEnvoi) document.getElementById('startInfo').hidden = false;

const video = document.getElementById('video');
const overlay = document.getElementById('overlay');
const startEl = document.getElementById('start');
const startErr = document.getElementById('startErr');
let facing = CONFIG.cameraParDefaut;
let stream = null;
let timerOn = false;

/* ---------- Caméra ---------- */
async function startCamera() {
  startErr.textContent = "";
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showStart("Ton navigateur ne permet pas l'accès à la caméra. Ouvre la page dans Safari ou Chrome.");
    return;
  }
  try {
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: facing, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    });
    video.srcObject = stream;
    video.classList.toggle('mirror', facing === 'user');
    await video.play();
    startEl.classList.add('hidden');
    drawOverlay();
  } catch (e) {
    let msg = "Impossible d'ouvrir la caméra.";
    if (e.name === 'NotAllowedError') msg = "Accès refusé. Autorise la caméra dans les réglages du navigateur, puis réessaie.";
    if (e.name === 'NotFoundError') msg = "Aucune caméra trouvée sur cet appareil.";
    showStart(msg);
  }
}
function showStart(err) { startEl.classList.remove('hidden'); startErr.textContent = err || ""; }

/* ---------- Dessins Halloween ---------- */
function spiderWeb(ctx, cx, cy, R, startAngle, u) {
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,.75)';
  ctx.lineWidth = 0.35 * u;
  const spokes = 6, rings = 5;
  const angles = [];
  for (let i = 0; i <= spokes; i++) angles.push(startAngle + (Math.PI / 2) * (i / spokes));
  angles.forEach(a => { ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(a) * R, cy + Math.sin(a) * R); ctx.stroke(); });
  for (let r = 1; r <= rings; r++) {
    const rr = R * r / rings;
    ctx.beginPath();
    for (let i = 0; i < angles.length - 1; i++) {
      const a1 = angles[i], a2 = angles[i + 1], am = (a1 + a2) / 2;
      const x1 = cx + Math.cos(a1) * rr, y1 = cy + Math.sin(a1) * rr;
      const x2 = cx + Math.cos(a2) * rr, y2 = cy + Math.sin(a2) * rr;
      const xm = cx + Math.cos(am) * rr * 0.86, ym = cy + Math.sin(am) * rr * 0.86;
      if (i === 0) ctx.moveTo(x1, y1);
      ctx.quadraticCurveTo(xm, ym, x2, y2);
    }
    ctx.stroke();
  }
  ctx.restore();
}

function emoji(ctx, char, x, y, size, rot = 0) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot);
  ctx.font = `${size}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(char, 0, 0);
  ctx.restore();
}

function paintFrame(ctx, w, h) {
  const u = Math.min(w, h) / 100;

  // Brume violette en haut et en bas
  let g = ctx.createLinearGradient(0, 0, 0, h * 0.28);
  g.addColorStop(0, 'rgba(26,8,40,.92)'); g.addColorStop(1, 'rgba(26,8,40,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h * 0.28);
  g = ctx.createLinearGradient(0, h, 0, h * 0.72);
  g.addColorStop(0, 'rgba(20,40,10,.75)'); g.addColorStop(0.4, 'rgba(26,8,40,.45)'); g.addColorStop(1, 'rgba(26,8,40,0)');
  ctx.fillStyle = g; ctx.fillRect(0, h * 0.72, w, h * 0.28);

  // Cadre orange lumineux
  ctx.save();
  ctx.strokeStyle = '#ff7a1a';
  ctx.shadowColor = '#ff7a1a'; ctx.shadowBlur = 3 * u;
  ctx.lineWidth = 1.4 * u;
  const m = 3 * u;
  ctx.beginPath();
  ctx.roundRect ? ctx.roundRect(m, m, w - 2 * m, h - 2 * m, 4 * u) : ctx.rect(m, m, w - 2 * m, h - 2 * m);
  ctx.stroke();
  ctx.restore();

  // Toiles d'araignée dans les coins du haut
  spiderWeb(ctx, m, m, 26 * u, 0, u);
  spiderWeb(ctx, w - m, m, 26 * u, Math.PI / 2, u);
  // Araignée qui pend
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 0.3 * u;
  ctx.beginPath(); ctx.moveTo(w - 16 * u, m); ctx.lineTo(w - 16 * u, 38 * u); ctx.stroke();
  ctx.restore();
  emoji(ctx, '🕷️', w - 16 * u, 41 * u, 7 * u);

  // Lune + chauves-souris
  ctx.save();
  const moonX = w / 2, moonY = 13 * u, moonR = 8 * u;
  const mg = ctx.createRadialGradient(moonX, moonY, moonR * 0.2, moonX, moonY, moonR * 2.4);
  mg.addColorStop(0, 'rgba(255,236,170,.55)'); mg.addColorStop(1, 'rgba(255,236,170,0)');
  ctx.fillStyle = mg; ctx.beginPath(); ctx.arc(moonX, moonY, moonR * 2.4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ffe9a8'; ctx.beginPath(); ctx.arc(moonX, moonY, moonR, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  emoji(ctx, '🧙‍♀️', moonX + 1 * u, moonY + 0.5 * u, 9 * u, -0.15);
  emoji(ctx, '🦇', w * 0.28, 9 * u, 6 * u, -0.3);
  emoji(ctx, '🦇', w * 0.72, 7 * u, 5 * u, 0.25);
  emoji(ctx, '🦇', w * 0.36, 19 * u, 4 * u, 0.15);

  // Titre
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  let size = 11 * u;
  ctx.font = `${size}px "Creepster", cursive`;
  while (ctx.measureText(CONFIG.titre).width > w * 0.86 && size > 4 * u) { size -= 0.5 * u; ctx.font = `${size}px "Creepster", cursive`; }
  const titleY = moonY + moonR + 3 * u + size;
  ctx.lineWidth = 1 * u; ctx.strokeStyle = '#1a0828'; ctx.strokeText(CONFIG.titre, w / 2, titleY);
  ctx.shadowColor = '#ff7a1a'; ctx.shadowBlur = 3 * u;
  ctx.fillStyle = '#ff7a1a'; ctx.fillText(CONFIG.titre, w / 2, titleY);

  // Date
  ctx.shadowColor = 'rgba(0,0,0,.8)'; ctx.shadowBlur = 1.5 * u;
  ctx.font = `600 ${4.6 * u}px "Cinzel", serif`;
  ctx.fillStyle = '#7dff6a';
  ctx.fillText('✦ ' + CONFIG.date + ' ✦', w / 2, titleY + 7 * u);
  ctx.font = `600 ${3.8 * u}px "Cinzel", serif`;
  ctx.fillStyle = '#ffe9a8';
  ctx.fillText(CONFIG.lieu, w / 2, titleY + 12.5 * u);
  ctx.restore();

  // Bas : citrouilles, chaudron, bougies, balai
  const by = h - 7 * u;
  emoji(ctx, '🎃', 11 * u, by - 2 * u, 13 * u, -0.1);
  emoji(ctx, '🎃', 22 * u, by + 1 * u, 8 * u, 0.15);
  emoji(ctx, '🕯️', 30 * u, by - 1 * u, 6 * u);
  emoji(ctx, '🎃', w - 11 * u, by - 2 * u, 13 * u, 0.1);
  emoji(ctx, '🧪', w - 22 * u, by, 7 * u, -0.2);
  emoji(ctx, '🕯️', w - 30 * u, by - 1 * u, 6 * u);
  emoji(ctx, '🧹', 7 * u, h * 0.55, 8 * u, -0.6);
  emoji(ctx, '🔮', w - 8 * u, h * 0.6, 7 * u);
}

function drawOverlay() {
  const dpr = window.devicePixelRatio || 1;
  overlay.width = overlay.clientWidth * dpr;
  overlay.height = overlay.clientHeight * dpr;
  const ctx = overlay.getContext('2d');
  ctx.clearRect(0, 0, overlay.width, overlay.height);
  paintFrame(ctx, overlay.width, overlay.height);
}
window.addEventListener('resize', drawOverlay);
// Redessine une fois les polices chargées
if (document.fonts) {
  Promise.all([document.fonts.load('40px "Creepster"'), document.fonts.load('600 20px "Cinzel"')])
    .then(drawOverlay).catch(() => {});
}

/* ---------- Prise de photo ---------- */
let lastBlob = null;
let counting = false;

function capture() {
  const sw = window.innerWidth, sh = window.innerHeight;
  const scale = Math.min(2, Math.max(1080 / Math.min(sw, sh), 1));
  const W = Math.round(sw * scale), H = Math.round(sh * scale);
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const ctx = c.getContext('2d');

  const vw = video.videoWidth, vh = video.videoHeight;
  const r = Math.max(W / vw, H / vh);
  const dw = vw * r, dh = vh * r;
  ctx.save();
  if (facing === 'user') { ctx.translate(W, 0); ctx.scale(-1, 1); }
  ctx.drawImage(video, (W - dw) / 2, (H - dh) / 2, dw, dh);
  ctx.restore();
  paintFrame(ctx, W, H);

  const f = document.getElementById('flash');
  f.style.transition = 'none'; f.style.opacity = 1;
  requestAnimationFrame(() => { f.style.transition = 'opacity .4s'; f.style.opacity = 0; });

  c.toBlob(blob => {
    lastBlob = blob;
    document.getElementById('photo').src = URL.createObjectURL(blob);
    document.getElementById('result').style.display = 'flex';
    document.getElementById('shareBtn').hidden = !canShareFile();
    document.getElementById('saveHint').textContent = isIOS
      ? "Appuie puis choisis « Enregistrer l'image » pour la garder dans tes Photos."
      : "Ta photo sera enregistrée dans ta Galerie.";
    sendPhoto(blob);
  }, 'image/jpeg', 0.9);
}

async function shoot() {
  if (counting || !stream) return;
  if (timerOn) {
    counting = true;
    const cd = document.getElementById('countdown');
    cd.style.display = 'flex';
    for (let i = 3; i > 0; i--) { cd.textContent = i; await new Promise(r => setTimeout(r, 1000)); }
    cd.style.display = 'none';
    counting = false;
  }
  capture();
}

/* ---------- Envoi automatique vers le Google Drive de l'organisateur ---------- */
async function sendPhoto(blob, tries = 3) {
  if (!CONFIG.urlEnvoi) return;
  const st = document.getElementById('sendStatus');
  st.hidden = false; st.classList.remove('err');
  st.textContent = "🧹 Envoi de la photo aux organisateurs…";
  const base64 = await new Promise(res => {
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(',')[1]);
    r.readAsDataURL(blob);
  });
  const body = JSON.stringify({ name: `${CONFIG.nomFichier}-${Date.now()}.jpg`, image: base64 });
  for (let i = 0; i < tries; i++) {
    try {
      // "text/plain" évite le blocage du navigateur ; le script Google lit le JSON quand même
      await fetch(CONFIG.urlEnvoi, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body });
      st.textContent = "✓ Photo envoyée aux organisateurs";
      return;
    } catch (e) {
      await new Promise(r => setTimeout(r, 1500));
    }
  }
  st.classList.add('err');
  st.textContent = "La photo n'a pas pu être envoyée (pas de réseau ?). Enregistre-la dans ta galerie.";
}

/* ---------- Enregistrer / partager ---------- */
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function photoFile() {
  return new File([lastBlob], `${CONFIG.nomFichier}-${Date.now()}.jpg`, { type: 'image/jpeg' });
}
function canShareFile() {
  try { return !!(navigator.canShare && navigator.canShare({ files: [photoFile()] })); } catch (e) { return false; }
}
function download() {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(lastBlob);
  a.download = photoFile().name;
  document.body.appendChild(a); a.click(); a.remove();
}
async function share() {
  try { await navigator.share({ files: [photoFile()] }); return true; }
  catch (e) { return e.name === 'AbortError'; }
}
async function save() {
  if (!lastBlob) return;
  const hint = document.getElementById('saveHint');
  if (isIOS && canShareFile()) {
    // iPhone : le menu de partage propose « Enregistrer l'image » (va dans Photos)
    hint.textContent = "Choisis « Enregistrer l'image » dans le menu.";
    if (await share()) return;
  }
  // Android et autres : enregistrement direct (dossier Téléchargements, visible dans la Galerie)
  download();
  hint.textContent = "✓ Photo enregistrée ! Retrouve-la dans ta Galerie (dossier Téléchargements). Si rien ne se passe, reste appuyé sur la photo puis « Télécharger l'image ».";
}

/* ---------- Boutons ---------- */
document.getElementById('startBtn').onclick = startCamera;
document.getElementById('shutter').onclick = shoot;
document.getElementById('switchBtn').onclick = () => { facing = facing === 'user' ? 'environment' : 'user'; startCamera(); };
document.getElementById('timerBtn').onclick = e => { timerOn = !timerOn; e.currentTarget.classList.toggle('on', timerOn); };
document.getElementById('retakeBtn').onclick = () => { document.getElementById('result').style.display = 'none'; };
document.getElementById('saveBtn').onclick = save;
document.getElementById('shareBtn').onclick = () => { if (lastBlob) share(); };

startCamera();
</script>
</body>
</html>
