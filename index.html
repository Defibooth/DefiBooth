<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Défis Photobooth</title>
  
  <!-- Polices élégantes Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
  
  <!-- Script Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      /* Fond chic sombre : Nuit & Prune profond */
      background: radial-gradient(circle at top, #231929 0%, #0d0a10 100%);
      color: #fceee9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 100vh;
      padding: 25px 15px;
      text-align: center;
    }

    header {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Emplacement du logo */
    .logo {
      width: 130px;
      max-width: 100%;
      height: auto;
      margin-bottom: 12px;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.5));
      display: block;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: 1px;
      /* Dégradé doré / Champagne */
      background: linear-gradient(135deg, #f3e7e1 0%, #d4af37 50%, #fdfcfb 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0px 4px 15px rgba(212, 175, 55, 0.2);
    }

    .subtitle {
      font-size: 0.95rem;
      font-weight: 400;
      color: rgba(252, 238, 233, 0.75);
      margin-top: 6px;
      font-style: italic;
    }

    .card-container {
      width: 100%;
      max-width: 350px;
      height: 240px;
      margin: 20px 0;
    }

    /* Carte au style verre dépoli & bordure dorée */
    .card {
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(212, 175, 55, 0.4);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      font-size: 1.25rem;
      font-weight: 600;
      line-height: 1.5;
      color: #ffffff;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4), inset 0 0 15px rgba(212, 175, 55, 0.05);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .card.stopped {
      transform: scale(1.03);
      border-color: rgba(212, 175, 55, 0.9);
      box-shadow: 0 0 25px rgba(212, 175, 55, 0.3), inset 0 0 20px rgba(212, 175, 55, 0.1);
    }

    /* Bouton principal */
    button {
      width: 100%;
      max-width: 300px;
      padding: 16px 0;
      font-family: 'Montserrat', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #0d0a10;
      /* Gradient doré chic */
      background: linear-gradient(135deg, #d4af37 0%, #f3e7e1 50%, #b89726 100%);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(212, 175, 55, 0.25);
      transition: all 0.3s ease;
      margin-bottom: 15px;
    }

    button:hover {
      box-shadow: 0 8px 25px rgba(212, 175, 55, 0.4);
      transform: translateY(-2px);
    }

    button:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body>

  <header>
    <!-- Balise mise à jour avec vérification d'erreur -->
    <img src="logo.png" alt="Logo Defibooth" class="logo" style="width: 200px;" onerror="console.error('Image non trouvée : vérifiez que logo.png est bien présent à la racine du dépôt GitHub.');">
    <h1>Défis Photobooth</h1>
    <p class="subtitle">Seras-tu prêt(e) à relever le défi ?</p>
  </header>

  <div class="card-container">
    <div class="card" id="card">Touche le bouton pour lancer</div>
  </div>

  <button id="actionBtn" onclick="toggleLoop()">LANCER</button>

  <script>
    const defis = [
      "Fais une grimace hilarante !",
      "Prends une photo avec le DJ",
      "Prends une photo avec ton meilleur profil",
      "Prends une photo que tu n'oserais pas publier sur les réseaux",
      "Prends une photo amusante avec 3 personnes",
      "Prends une photo avec l'air dégoûté d'être là",
      "Imite la pose d'une statue célèbre",
      "Fais ta plus belle pose de mannequin sur tapis rouge"
    ];

    let intervalId = null;
    let isRunning = false;
    let lastIndex = -1;
    const card = document.getElementById('card');
    const btn = document.getElementById('actionBtn');

    function toggleLoop() {
      if (isRunning) {
        clearInterval(intervalId);
        isRunning = false;
        btn.innerText = "RECOMMENCER";
        btn.style.background = "linear-gradient(135deg, #d4af37 0%, #f3e7e1 50%, #b89726 100%)";
        btn.style.color = "#0d0a10";
        card.classList.add('stopped');
        
        // Confettis dorés & blanc chic
        if (typeof confetti === "function") {
          confetti({
            particleCount: 80,
            spread: 70,
            origin: { y: 0.65 },
            colors: ['#d4af37', '#ffffff', '#f3e7e1']
          });
        }
      } else {
        card.classList.remove('stopped');
        isRunning = true;
        btn.innerText = "STOP !";
        /* Bouton rouge/rosé chic lors du stop */
        btn.style.background = "linear-gradient(135deg, #a32a48 0%, #e05275 100%)";
        btn.style.color = "#ffffff";
        
        intervalId = setInterval(() => {
          let randomIndex;
          do {
            randomIndex = Math.floor(Math.random() * defis.length);
          } while (randomIndex === lastIndex && defis.length > 1);
          
          lastIndex = randomIndex;
          card.innerText = defis[randomIndex];
        }, 60);
      }
    }
  </script>

</body>
</html>
